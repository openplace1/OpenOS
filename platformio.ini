; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:denky32]
platform = espressif32
board = denky32
framework = arduino
board_build.partitions = huge_app.csv
# The stock denky32 board profile incorrectly declares PSRAM. This hardware is
# a WROOM32 without it, so probing only wastes boot time and logs an error.
build_unflags = -DBOARD_HAS_PSRAM
# Keep the CYD display setup in the project. Relying on TFT_eSPI's global
# User_Setup.h selects the wrong DC and reset pins on a clean installation.
build_flags =
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
upload_port = COM3
monitor_speed = 115200
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
platform_packages = espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
